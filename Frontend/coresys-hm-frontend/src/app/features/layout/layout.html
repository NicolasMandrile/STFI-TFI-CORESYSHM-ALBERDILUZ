<div class="shell" [class.shell--collapsed]="!sidebarOpen">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <!-- Logo -->
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="14" fill="#4f46e5"/>
        <path d="M14 28h6l4-10 8 20 4-10h6" stroke="#fff" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="sidebar-logo-text">CoreSys<b>HM</b></span>
    </div>

    <!-- Navegación -->
    <nav class="sidebar-nav">
      <ng-container *ngFor="let item of navItems">
        <ng-container *appHasPermission="item.permiso">
          <div class="nav-section-label" *ngIf="item.section">{{ item.section }}</div>
          <a class="nav-item" [routerLink]="item.route" routerLinkActive="nav-item--active">
            <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </ng-container>
      </ng-container>
    </nav>

    <!-- Usuario en sidebar -->
    <div class="sidebar-user" *ngIf="currentUser$ | async as user">
      <div class="user-avatar">{{ user.nombreUsuario[0].toUpperCase() }}</div>
      <div class="user-info">
        <span class="user-name">{{ user.nombreUsuario }}</span>
        <span class="user-role">{{ user.rol }}</span>
      </div>
      <button class="btn-logout-sm" (click)="logout()" title="Cerrar sesión">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- ── CONTENIDO PRINCIPAL ── -->
  <div class="main-wrapper">

    <!-- Topbar -->
    <header class="topbar">
      <button class="btn-menu" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <div class="topbar-right" *ngIf="currentUser$ | async as user">
        <span class="topbar-user">{{ user.nombreUsuario }}</span>
        <div class="topbar-avatar">{{ user.nombreUsuario[0].toUpperCase() }}</div>
      </div>
    </header>

    <!-- Vista del módulo activo -->
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
